<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">  
    <title>Expense Tracker</title>
</head>

<body>
    <!-- PANTALLA DE LOGIN (Visible por defecto) -->
    <div id="auth-section" style="max-width: 400px; margin: 50px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <h2 style="text-align: center;">Iniciar Sesión</h2>
        <form id="login-form">
            <div style="margin-bottom: 10px;">
                <label for="login-email">Correo:</label>
                <input type="email" id="login-email" required style="width: 100%; padding: 8px;">
            </div>
            <div style="margin-bottom: 10px;">
                <label for="login-password">Contraseña:</label>
                <input type="password" id="login-password" required style="width: 100%; padding: 8px;">
            </div>
            <button type="submit" style="width: 100%; padding: 10px; background: #3498db; color: white; border: none; cursor: pointer;">Entrar</button>
        </form>
        <p style="text-align: center; margin-top: 10px; font-size: 14px;">
            ¿No tienes cuenta? <a href="#" id="show-register">Regístrate aquí</a>
        </p>
    </div>

    <!-- PANTALLA DE REGISTRO (Oculta por defecto) -->
    <div id="register-section" style="display: none; max-width: 400px; margin: 50px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <h2 style="text-align: center;">Crear Cuenta</h2>
        <form id="register-form">
            <div style="margin-bottom: 10px;">
                <label for="register-email">Correo:</label>
                <input type="email" id="register-email" required style="width: 100%; padding: 8px;">
            </div>
            <div style="margin-bottom: 10px;">
                <label for="register-password">Contraseña:</label>
                <input type="password" id="register-password" required style="width: 100%; padding: 8px;">
            </div>
            <button type="submit" style="width: 100%; padding: 10px; background: #2ecc71; color: white; border: none; cursor: pointer;">Registrarse</button>
        </form>
        <p style="text-align: center; margin-top: 10px; font-size: 14px;">
            ¿Ya tienes cuenta? <a href="#" id="show-login">Inicia sesión</a>
        </p>
    </div>
    <div id="app-section" style="display: none;">
    <header>
        <h1>Expense Tracker</h1>
        <p>Controla tus gastos de forma sencilla.</p>
    </header>

    <main>

        <section>
            <h2>Agregar gasto</h2>

            <form id="expense-form">

                <div>
                    <label for="description">Descripción</label>
                    <input 
                        type="text" 
                        id="description"
                        placeholder="Ej. Almuerzo"
                        required
                    >
                </div>

                <div>
                    <label for="amount">Monto</label>
                    <input 
                        type="number"
                        id="amount"
                        placeholder="0.00"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <div>
                    <label for="category">Categoría</label>

                    <select id="category" required>
                        <option value="">Selecciona una categoría</option>
                        <option value="alimentacion">Alimentación</option>
                        <option value="transporte">Transporte</option>
                        <option value="servicios">Servicios</option>
                        <option value="entretenimiento">Entretenimiento</option>
                        <option value="otros">Otros</option>
                    </select>
                </div>

                <div>
                    <label for="date">Fecha</label>

                    <input 
                        type="date"
                        id="date"
                        required
                    >
                </div>

                <div>
                    <label for="time">Hora</label>
                    <input type="time" id="time" required>
                </div>

                <button type="submit">
                    Agregar gasto
                </button>

            </form>
        </section>

        <section>
            <h2>Resumen</h2>

            <p>
                Total gastado:
                <strong id="total-expenses">S/ 0.00</strong>
            </p>
        </section>

        <section>
            <h2>Mis gastos</h2>

            <div id="expense-list">
                
                <p>No hay gastos registrados.</p>
            
                <p id="loading-message">Cargando gastos...</p>
            </div>
        </section>

    </main>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
</body>

</html>
